[project]
name = "fiatvox"
version = "0.1.7"
description = "Turn EPUB and PDF books into chaptered audiobooks with Kokoro, on Apple Silicon Macs."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kokoro==0.9.4",
    "misaki[en]==0.9.4",
    "torch>=2.6",
    "numpy",
    "soundfile",
    "pymupdf>=1.26",
    "pyobjc-framework-Vision>=11",
    "pyobjc-framework-Quartz>=11",
    "httpx>=0.27",
    "keyring>=25",
    "textual>=1.0",
    "en_core_web_sm",
    "anthropic>=1.15.0",
]

[project.scripts]
fiatvox = "fiatvox.cli:main"

[tool.uv.sources]
en_core_web_sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fiatvox"]

[tool.hatch.build.targets.wheel.force-include]
"pronunciation" = "fiatvox/data/pronunciation"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: needs Kokoro, misaki or ffmpeg (deselect with -m 'not slow')"]
